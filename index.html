<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "ze4sgur00l");
  </script>
  <title>Teste A/B — LocadoraVeiculos</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f4f8f5;
      color: #193a31;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 860px);
    }

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -.04em;
      line-height: 1.15;
    }

    header p {
      margin: 0;
      color: #667d72;
      font-size: 1.05rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    article {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 32px;
      border: 1px solid #dce9df;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(28, 69, 47, .06);
    }

    .label {
      margin-bottom: 20px;
      padding: 5px 10px;
      border-radius: 100px;
      background: #eaf4ec;
      color: #387358;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      letter-spacing: -.02em;
    }

    article p {
      margin: 0 0 28px;
      color: #667d72;
      line-height: 1.6;
      flex: 1;
    }

    .button {
      display: inline-block;
      padding: 11px 17px;
      border-radius: 8px;
      background: #205b46;
      color: #fff;
      text-decoration: none;
      font-weight: 650;
      transition: background-color .2s ease;
    }

    .button:hover {
      background: #327657;
    }

    .button:focus-visible {
      outline: 3px solid #85bba0;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      article {
        padding: 26px;
      }

      header {
        margin-bottom: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Teste A/B — LocadoraVeiculos</h1>
      <p>Selecione uma das versões para visualizar.</p>
    </header>
    <div class="cards">
      <article>
        <span class="label">Controle</span>
        <h2>Versão A (Controle)</h2>
        <p>Interface original da locadora.</p>
        <a class="button" href="https://eduardotadeudealmeida.github.io/LocadoraVeiculos/">Acessar versão A</a>
      </article>
      <article>
        <span class="label">Variante</span>
        <h2>Versão B (Variante)</h2>
        <p>Interface modificada para destacar veículos de alta margem.</p>
        <a class="button" href="TesteB/index.html">Acessar versão B</a>
      </article>
    </div>
  </main>
</body>

</html>
